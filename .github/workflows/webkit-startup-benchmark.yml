name: Compare complete cold WebKit startup
on:
  push:
    branches: [test/gha-webkit-20261104]
    paths: [.github/workflows/webkit-startup-benchmark.yml]
permissions:
  contents: read
  packages: read
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        trial: [1, 2, 3, 4, 5]
        variant: [legacy, fast3, fast6, fast10]
    env:
      FAST_MODE: offline
      LEGACY_VALIDATION: ${{ matrix.variant == 'legacy' && '1' || '0' }}
      PULL_PARALLELISM: ${{ matrix.variant == 'fast6' && '6' || matrix.variant == 'fast10' && '10' || '3' }}
      GHCR_TOKEN: ${{ github.token }}
    steps:
      - name: Legacy repository checkout
        if: matrix.variant == 'legacy'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Measure startup using the approved launcher source
        run: |
          python3 - <<'PY'
          import hashlib,os,time,urllib.request
          start=time.monotonic()
          url='https://api.github.com/repos/gabrielccac/captcha-solver/contents/experiments/gha-webkit/fast_run.py?ref=3345f51c8d54f9413a2cae5a10a7454d63db8b3e'
          request=urllib.request.Request(url,headers={'Accept':'application/vnd.github.raw+json','Authorization':'Bearer '+os.environ['GHCR_TOKEN'],'X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(request,timeout=30) as response:
              source=response.read()
          assert hashlib.sha256(source).hexdigest()=='9b0d9505a9e11abbfa987985f091bf5b5beefda4f68096483f0c3d4d0d906d9a'
          os.environ['FAST_SOURCE_FETCH_MS']=str(round((time.monotonic()-start)*1000))
          exec(compile(source,url,'exec'),{'__name__':'__main__'})
          PY
      - name: Save offline timing metadata only
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: startup-${{ matrix.variant }}-${{ matrix.trial }}
          path: fast-launch-result.json
          if-no-files-found: error
          retention-days: 7
