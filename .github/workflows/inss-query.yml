name: Meu INSS - consulta privada
run-name: INSS n8n ${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Identificador opaco da consulta
        required: true
        type: string
permissions:
  contents: read
  packages: read
concurrency:
  group: n8n-inss-query
  cancel-in-progress: false
jobs:
  query:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: n8n-inss-query
    steps:
      - name: Login and query using the approved immutable browser image
        env:
          GHCR_TOKEN: ${{ github.token }}
          GOVBR_CPF: ${{ secrets.SMOKE_GOVBR_CPF }}
          GOVBR_PASSWORD: ${{ secrets.SMOKE_GOVBR_PASSWORD }}
          OPENROUTER_API_KEY: ${{ secrets.SMOKE_OPENROUTER_API_KEY }}
          QUERY_RECIPIENT_CERT: ${{ secrets.SMOKE_QUERY_RECIPIENT_CERT }}
        run: |
          python3 - <<'PY'
          import hashlib,os,pathlib,runpy,tempfile,urllib.request
          sources={'query_run.py':'db2554ee8a0fb35ddd608b6568e533457a9d834bb1ef4e09cd52bb7e8a4b4191','query_worker.py':'56e7efbed36ca56ea5ea591328484b98393264fa6be1365f434b64f8913e6edd'}
          with tempfile.TemporaryDirectory(prefix='private-query-source-') as directory:
              root=pathlib.Path(directory)
              for name,expected in sources.items():
                  url=f'https://api.github.com/repos/gabrielccac/captcha-solver/contents/experiments/gha-webkit/{name}?ref=5a671a2891699547783501187dcb996e0e1c8932'
                  request=urllib.request.Request(url,headers={'Accept':'application/vnd.github.raw+json','Authorization':'Bearer '+os.environ['GHCR_TOKEN'],'X-GitHub-Api-Version':'2022-11-28'})
                  with urllib.request.urlopen(request,timeout=30) as response:
                      source=response.read()
                  assert hashlib.sha256(source).hexdigest()==expected
                  (root/name).write_bytes(source)
              runpy.run_path(str(root/'query_run.py'),run_name='__main__')
          PY
      - name: Save only recipient-encrypted query and numeric receipt
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: inss-encrypted-result
          path: encrypted-query/
          retention-days: 1
          if-no-files-found: error
