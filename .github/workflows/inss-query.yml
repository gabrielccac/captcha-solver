name: Meu INSS - autenticação privada
run-name: INSS n8n ${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Identificador opaco da autenticação
        required: true
        type: string
      job_id:
        description: Referência de uso único para obter credenciais do relay configurado
        type: string
permissions:
  contents: read
  packages: read
concurrency:
  group: ${{ inputs.job_id && format('inss-query-{0}', inputs.job_id) || 'n8n-inss-query' }}
  cancel-in-progress: false
jobs:
  query:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: ${{ (inputs.job_id && vars.INSS_RELAY_ENVIRONMENT) || 'n8n-inss-query' }}
    steps:
      - name: Authenticate and export encrypted API credentials
        env:
          GHCR_TOKEN: ${{ github.token }}
          INSS_JOB_ID: ${{ inputs.job_id }}
          INSS_CLAIM_URL: ${{ vars.INSS_CLAIM_URL }}
          INSS_CLAIM_BEARER: ${{ secrets[vars.INSS_CLAIM_SECRET_NAME || 'INSS_CLAIM_BEARER'] }}
          GOVBR_CPF: ${{ secrets.SMOKE_GOVBR_CPF }}
          GOVBR_PASSWORD: ${{ secrets.SMOKE_GOVBR_PASSWORD }}
          OPENROUTER_API_KEY: ${{ secrets.SMOKE_OPENROUTER_API_KEY }}
          QUERY_RECIPIENT_CERT: ${{ secrets.SMOKE_QUERY_RECIPIENT_CERT }}
        run: |
          set -euo pipefail
          export INSS_SOURCE_DIR="$(mktemp -d)"
          trap 'rm -rf -- "$INSS_SOURCE_DIR"' EXIT
          GH_TOKEN="$GHCR_TOKEN" gh api "repos/$GITHUB_REPOSITORY/tarball/$GITHUB_SHA" |
            tar -xz --strip-components=1 -C "$INSS_SOURCE_DIR"
          python3 "$INSS_SOURCE_DIR/deploy/actions/query_run.py"
      - name: Save only recipient-encrypted query and numeric receipt
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: inss-encrypted-result
          path: encrypted-query/
          retention-days: 1
          if-no-files-found: error
