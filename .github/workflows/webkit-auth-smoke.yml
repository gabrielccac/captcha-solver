name: WebKit headless - authorized authentication smoke test
on:
  push:
    branches: [test/gha-webkit-20261104]
    paths: [experiments/gha-webkit/image.ref]
permissions:
  contents: read
  packages: read
concurrency:
  group: authorized-webkit-smoke
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: webkit-smoke-20261104
    env:
      DOCKER_CONFIG: /tmp/webkit-ghcr-auth
    steps:
      - name: Checkout reviewed experiment
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Resolve the previously validated immutable image
        run: |
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          image=Path('experiments/gha-webkit/image.ref').read_text().strip()
          assert re.fullmatch(r'ghcr\.io/gabrielccac/captcha-solver-webkit-smoke@sha256:[0-9a-f]{64}',image)
          with open(os.environ['GITHUB_ENV'],'a') as stream:
              stream.write('WEBKIT_IMAGE='+image+'\n')
          PY
      - name: Authenticate to the associated container registry
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Download the prebuilt validated image
        run: docker pull "$WEBKIT_IMAGE"
      - name: Mandatory offline authentication tests
        run: >-
          docker run --rm --network none --read-only
          --tmpfs /tmp:rw,nosuid,size=512m,mode=1777
          --entrypoint python "$WEBKIT_IMAGE"
          -m pytest tests/test_auth.py tests/test_browser_captcha.py -q -p no:cacheprovider
      - name: Offline WebKit render and input preflight
        run: >-
          docker run --rm --init --network none --read-only --cpus 1 --memory 1400m
          --pids-limit 320 --shm-size 128m --tmpfs /tmp:rw,nosuid,size=512m,mode=1777
          --security-opt seccomp=experiments/gha-webkit/seccomp.json
          "$WEBKIT_IMAGE" --offline-preflight
      - name: One real login and authenticated endpoint validation
        env:
          GOVBR_CPF: ${{ secrets.SMOKE_GOVBR_CPF }}
          GOVBR_PASSWORD: ${{ secrets.SMOKE_GOVBR_PASSWORD }}
          OPENROUTER_API_KEY: ${{ secrets.SMOKE_OPENROUTER_API_KEY }}
        run: python3 experiments/gha-webkit/run_container.py
      - name: Remove registry login
        if: always()
        run: docker logout ghcr.io
