name: WebKit headless - authorized authentication smoke test
on:
  push:
    branches: [test/gha-webkit-20261104]
    paths: [.github/workflows/webkit-auth-smoke.yml, experiments/gha-webkit/image.ref]
permissions:
  contents: read
  packages: read
concurrency:
  group: authorized-webkit-smoke
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: webkit-smoke-20261104
    steps:
      - name: Run the approved worker without repository checkout
        env:
          FAST_MODE: live
          PULL_PARALLELISM: '10'
          GHCR_TOKEN: ${{ github.token }}
          GOVBR_CPF: ${{ secrets.SMOKE_GOVBR_CPF }}
          GOVBR_PASSWORD: ${{ secrets.SMOKE_GOVBR_PASSWORD }}
          OPENROUTER_API_KEY: ${{ secrets.SMOKE_OPENROUTER_API_KEY }}
        run: |
          python3 - <<'PY'
          import hashlib,os,time,urllib.request
          start=time.monotonic()
          url='https://api.github.com/repos/gabrielccac/captcha-solver/contents/experiments/gha-webkit/fast_run.py?ref=6b3b03e33ce459a17bb2b0198cc45241bf9319b5'
          request=urllib.request.Request(url,headers={'Accept':'application/vnd.github.raw+json','Authorization':'Bearer '+os.environ['GHCR_TOKEN'],'X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(request,timeout=30) as response:
              source=response.read()
          assert hashlib.sha256(source).hexdigest()=='d14c0f0503a83b9f7013938253e1e258eb69c5fd73ab267e26435df5b2694797'
          os.environ['FAST_SOURCE_FETCH_MS']=str(round((time.monotonic()-start)*1000))
          exec(compile(source,url,'exec'),{'__name__':'__main__'})
          PY
