name: Meu INSS - teste de portabilidade
run-name: INSS credencial teste ${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Identificador opaco da consulta
        required: true
        type: string
permissions:
  contents: read
  packages: read
concurrency:
  group: inss-credential-boundary-test
  cancel-in-progress: false
jobs:
  query:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: n8n-inss-query
    steps:
      - name: Login and query using the approved immutable browser image
        env:
          GHCR_TOKEN: ${{ github.token }}
          GOVBR_CPF: ${{ secrets.SMOKE_GOVBR_CPF }}
          GOVBR_PASSWORD: ${{ secrets.SMOKE_GOVBR_PASSWORD }}
          OPENROUTER_API_KEY: ${{ secrets.SMOKE_OPENROUTER_API_KEY }}
          QUERY_RECIPIENT_CERT: ${{ secrets.SMOKE_QUERY_RECIPIENT_CERT }}
        run: |
          set -euo pipefail
          export INSS_SOURCE_DIR="$(mktemp -d)"
          trap 'rm -rf -- "$INSS_SOURCE_DIR"' EXIT
          GH_TOKEN="$GHCR_TOKEN" gh api "repos/$GITHUB_REPOSITORY/tarball/$GITHUB_SHA" |
            tar -xz --strip-components=1 -C "$INSS_SOURCE_DIR"
          printf '%s' '' | base64 --decode > "$INSS_SOURCE_DIR/deploy/actions/query_worker.py"
          sed -i "s/'raw_tokens_exported': False/'raw_tokens_exported': False, 'api_credentials_encrypted': validation.get('success', False)/" "$INSS_SOURCE_DIR/deploy/actions/query_run.py"
          python3 "$INSS_SOURCE_DIR/deploy/actions/query_run.py"
      - name: Save only recipient-encrypted query and numeric receipt
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: inss-encrypted-result
          path: encrypted-query/
          retention-days: 1
          if-no-files-found: error
