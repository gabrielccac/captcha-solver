name: Meu INSS - validação ARIA
run-name: ARIA INSS ${{ inputs.job_id }}
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Identificador opaco de uso único
        required: true
        type: string
permissions:
  contents: read
  packages: read
jobs:
  preview:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: n8n-inss-jean-pilot
    steps:
      - name: Claim one case and read BPC payment data
        env:
          GHCR_TOKEN: ${{ github.token }}
          JEAN_JOB_ID: ${{ inputs.job_id }}
          JEAN_RELAY_BEARER: ${{ secrets.JEAN_RELAY_BEARER }}
          OPENROUTER_API_KEY: ${{ secrets.SMOKE_OPENROUTER_API_KEY }}
          QUERY_RECIPIENT_CERT: ${{ secrets.SMOKE_QUERY_RECIPIENT_CERT }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,re,runpy,tempfile,urllib.request
          job=os.environ.pop('JEAN_JOB_ID')
          assert re.fullmatch(r'[a-f0-9]{32}',job)
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args):
                  return None
          opener=urllib.request.build_opener(NoRedirect)
          token=os.environ.pop('JEAN_RELAY_BEARER')
          claim=urllib.request.Request('https://inss.46-225-210-101.sslip.io/v1/jean-jobs/claim',
              data=json.dumps({'job_id':job}).encode(),
              headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'})
          with opener.open(claim,timeout=15) as response:
              credentials=json.load(response)
          assert set(credentials)=={'GOVBR_CPF','GOVBR_PASSWORD'}
          os.environ.update(credentials)
          credentials.clear()
          sources={'experiments/gha-webkit/query_run.py': '3e9cad02e7a5789b8ade7502bb67092108073df4be296417bcbe6188c2ccb3e0', 'experiments/gha-webkit/query_worker.py': '80dc544ecb0566f3d6127e948074f2198cc1a718bf907d6fa5937cacca5c5ea3', 'experiments/gha-webkit/jean_worker.py': 'ad94e2ff5288644e925f7156e5a7c8ce0b4f802e7bcae4019c72bca1547341f4', 'src/auth/govbr.py': '258c93aa4d1960f58c030026a29ca2c531cf04980a4d107ea955bbf871d36316', 'src/inss/http_login.py': '4b4af486c83105e5a0b48c864b835c19fc19f6124526ac191846f98c259b2689'}
          with tempfile.TemporaryDirectory(prefix='jean-query-') as temporary:
              root=pathlib.Path(temporary)
              for path,expected in sources.items():
                  url=f'https://api.github.com/repos/gabrielccac/captcha-solver/contents/{path}?ref=7d7a4553fcb22f1a22ed67a1381e82cc3697ac45'
                  request=urllib.request.Request(url,headers={'Accept':'application/vnd.github.raw+json',
                      'Authorization':'Bearer '+os.environ['GHCR_TOKEN'],'X-GitHub-Api-Version':'2022-11-28'})
                  with opener.open(request,timeout=30) as response:
                      raw=response.read()
                  assert hashlib.sha256(raw).hexdigest()==expected
                  (root/pathlib.PurePosixPath(path).name).write_bytes(raw)
              os.environ['QUERY_WORKER_FILE']='jean_worker.py'
              import base64
              raw=base64.b64decode('')
              assert hashlib.sha256(raw).hexdigest()=='bc4e821930f8f5b438085f778448a15942c4a2bebb5fa46c4444ea5410ca94f9'
              (root/'aria.py').write_bytes(raw)
              raw=base64.b64decode('')
              assert hashlib.sha256(raw).hexdigest()=='7db9eb632bd62661dfb88510e9837ca537e5b5a9e866ea0e2b27cb624ffb9f41'
              (root/'interactions.py').write_bytes(raw)
              raw=base64.b64decode('')
              assert hashlib.sha256(raw).hexdigest()=='ea1f68b71d00ae871b0e22d05b67b59e5c87bc639a589ce08cae8400aafbfa45'
              (root/'hcaptcha.py').write_bytes(raw)
              raw=base64.b64decode('')
              assert hashlib.sha256(raw).hexdigest()=='f11551e12911de731962a7974c7c88df670558104a7ad77ccd2fb00155b41819'
              (root/'http_login.py').write_bytes(raw)
              raw=base64.b64decode('')
              assert hashlib.sha256(raw).hexdigest()=='35a63682751da37f0f7536e0901baf7c97cddbecf232f7403776b485cac7855c'
              (root/'query_worker.py').write_bytes(raw)
              (root/'jean_worker.py').write_bytes(base64.b64decode(''))
              runner=root/'query_run.py'
              code=runner.read_text()
              anchor="if __name__ == '__main__':"
              assert code.count(anchor)==1
              code=code.replace(anchor, "JEAN_SOURCE_MOUNTS.update({'aria.py': '/app/src/captcha/aria.py', 'interactions.py': '/app/src/captcha/interactions.py', 'hcaptcha.py': '/app/src/captcha/hcaptcha.py', 'http_login.py': '/app/src/inss/http_login.py', 'query_worker.py': '/query_support.py'})\n\n"+anchor)
              runner.write_text(code)
              print('ARIA_CANDIDATE '+json.dumps({'src/captcha/aria.py': 'bc4e821930f8f5b438085f778448a15942c4a2bebb5fa46c4444ea5410ca94f9', 'src/captcha/interactions.py': '7db9eb632bd62661dfb88510e9837ca537e5b5a9e866ea0e2b27cb624ffb9f41', 'src/captcha/hcaptcha.py': 'ea1f68b71d00ae871b0e22d05b67b59e5c87bc639a589ce08cae8400aafbfa45', 'src/inss/http_login.py': 'f11551e12911de731962a7974c7c88df670558104a7ad77ccd2fb00155b41819', 'experiments/gha-webkit/query_worker.py': '35a63682751da37f0f7536e0901baf7c97cddbecf232f7403776b485cac7855c'}),flush=True)
              runpy.run_path(str(root/'query_run.py'),run_name='__main__')
          PY

      - name: Upload recipient-encrypted output
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: inss-encrypted-result
          path: encrypted-query/
          retention-days: 1
          if-no-files-found: ignore
