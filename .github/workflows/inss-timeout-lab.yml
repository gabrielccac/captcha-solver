name: INSS SSO read-timeout lab
run-name: INSS timeout lab ${{ inputs.read_timeout_seconds }}s
on:
  workflow_dispatch:
    inputs:
      read_timeout_seconds:
        description: Read timeout for the SSO handoff POST (connect timeout stays 30s)
        required: true
        type: choice
        options:
          - '30'
          - '60'
        default: '30'
permissions:
  contents: read
  packages: read
concurrency:
  group: n8n-inss-query
  cancel-in-progress: false
jobs:
  lab:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: n8n-inss-query
    steps:
      - name: Authenticate and export encrypted lab result
        env:
          GHCR_TOKEN: ${{ github.token }}
          INSS_REQUEST_ID: explab-${{ github.run_id }}-${{ github.run_attempt }}
          GOVBR_CPF: ${{ secrets.SMOKE_GOVBR_CPF }}
          GOVBR_PASSWORD: ${{ secrets.SMOKE_GOVBR_PASSWORD }}
          OPENROUTER_API_KEY: ${{ secrets.SMOKE_OPENROUTER_API_KEY }}
          QUERY_RECIPIENT_CERT: ${{ secrets.SMOKE_QUERY_RECIPIENT_CERT }}
          LAB_READ_TIMEOUT_SECONDS: ${{ inputs.read_timeout_seconds }}
        run: |
          set -euo pipefail
          export INSS_SOURCE_DIR="$(mktemp -d)"
          trap 'rm -rf -- "$INSS_SOURCE_DIR"' EXIT
          GH_TOKEN="$GHCR_TOKEN" gh api "repos/$GITHUB_REPOSITORY/tarball/$GITHUB_SHA" |
            tar -xz --strip-components=1 -C "$INSS_SOURCE_DIR"

          python3 - "$INSS_SOURCE_DIR/src/auth/handoff.py" "$LAB_READ_TIMEOUT_SECONDS" <<'PY'
          from pathlib import Path
          import sys

          source = Path(sys.argv[1])
          mode = sys.argv[2]
          if mode not in {"30", "60"}:
              raise SystemExit("invalid_read_timeout_mode")
          text = source.read_text(encoding="utf-8")
          marker = (
              'return session.post(self.url, data=self.body.encode("utf-8"), headers=headers,\n'
              '                                timeout=30, allow_redirects=False)'
          )
          replacement = marker.replace("timeout=30", "timeout=(30, 60)")
          get_marker = "response = session.get(target, timeout=30, allow_redirects=False)"
          if text.count(marker) != 1 or text.count(get_marker) != 1:
              raise SystemExit("handoff_timeout_markers_mismatch")
          if mode == "60":
              text = text.replace(marker, replacement, 1)
              if text.count(replacement) != 1 or text.count(marker) != 0:
                  raise SystemExit("temporary_timeout_patch_failed")
              source.write_text(text, encoding="utf-8")
          if get_marker not in text:
              raise SystemExit("handoff_get_timeout_changed")
          PY

          printf '{"read_timeout_seconds":%s,"source_sha":"%s"}\n' "$LAB_READ_TIMEOUT_SECONDS" "$GITHUB_SHA"
          python3 "$INSS_SOURCE_DIR/deploy/actions/query_run.py"
      - name: Save encrypted result and numeric receipt
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: inss-timeout-lab-result-${{ inputs.read_timeout_seconds }}
          path: encrypted-query/
          retention-days: 1
          if-no-files-found: error
