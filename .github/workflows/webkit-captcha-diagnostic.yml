name: WebKit one-time private protocol lookup
on:
  push:
    branches: [test/gha-webkit-20261104]
    paths: [.github/workflows/webkit-captcha-diagnostic.yml]
permissions:
  contents: read
  packages: read
concurrency:
  group: authorized-webkit-smoke
  cancel-in-progress: false
jobs:
  query:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: webkit-smoke-20261104
    steps:
      - name: Login and query using the approved immutable browser image
        env:
          GHCR_TOKEN: ${{ github.token }}
          GOVBR_CPF: ${{ secrets.SMOKE_GOVBR_CPF }}
          GOVBR_PASSWORD: ${{ secrets.SMOKE_GOVBR_PASSWORD }}
          OPENROUTER_API_KEY: ${{ secrets.SMOKE_OPENROUTER_API_KEY }}
          QUERY_RECIPIENT_CERT: ${{ secrets.SMOKE_QUERY_RECIPIENT_CERT }}
          QUERY_PROTOCOL: ${{ secrets.SMOKE_QUERY_PROTOCOL }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,os,pathlib,runpy,tempfile,urllib.request
          with tempfile.TemporaryDirectory(prefix='protocol-query-') as directory:
              root=pathlib.Path(directory)
              url='https://api.github.com/repos/gabrielccac/captcha-solver/contents/experiments/gha-webkit/query_run.py?ref=5a671a2891699547783501187dcb996e0e1c8932'
              request=urllib.request.Request(url,headers={'Accept':'application/vnd.github.raw+json','Authorization':'Bearer '+os.environ['GHCR_TOKEN'],'X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(request,timeout=30) as response:
                  source=response.read()
              assert hashlib.sha256(source).hexdigest()=='db2554ee8a0fb35ddd608b6568e533457a9d834bb1ef4e09cd52bb7e8a4b4191'
              (root/'query_run.py').write_bytes(source)
              (root/'query_worker.py').write_bytes(base64.b64decode(''))
              module=runpy.run_path(str(root/'query_run.py'))
              module['main'].__globals__['KEYS'] += ('QUERY_PROTOCOL',)
              raise SystemExit(module['main']())
          PY
      - name: Save only recipient-encrypted query and numeric receipt
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: inss-encrypted-result
          path: encrypted-query/
          retention-days: 1
          if-no-files-found: error
