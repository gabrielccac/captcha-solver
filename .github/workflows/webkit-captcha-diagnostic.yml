name: Compare screenshot and network image paths
on:
  push:
    branches: [test/gha-webkit-20261104]
    paths: [.github/workflows/webkit-captcha-diagnostic.yml]
permissions:
  contents: read
  packages: read
concurrency:
  group: authorized-webkit-smoke
  cancel-in-progress: false
jobs:
  query:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: webkit-smoke-20261104
    steps:
      - name: Login and query using the approved immutable browser image
        env:
          GHCR_TOKEN: ${{ github.token }}
          GOVBR_CPF: ${{ secrets.SMOKE_GOVBR_CPF }}
          GOVBR_PASSWORD: ${{ secrets.SMOKE_GOVBR_PASSWORD }}
          OPENROUTER_API_KEY: ${{ secrets.SMOKE_OPENROUTER_API_KEY }}
          QUERY_RECIPIENT_CERT: ${{ secrets.SMOKE_QUERY_RECIPIENT_CERT }}
        run: |
          python3 - <<'PY'
          import hashlib,os,pathlib,runpy,sys,tempfile,urllib.request
          sources={'query_run.py': '8438acf1c1b57616379e829a08bcaf94a491a214b979fc6afca693f31cf2849b', 'compare_run.py': '0b7250d87da975ebc82b1bed105ba28c3f8e04104a6a2c24a0a0fe3f95904f89', 'compare_worker.py': '906bc03d1396069fb23ba4385444c80f0b3835d49b2991cf3ea0a1c2488ef22a'}
          with tempfile.TemporaryDirectory(prefix='private-query-source-') as directory:
              root=pathlib.Path(directory)
              for name,expected in sources.items():
                  url=f'https://api.github.com/repos/gabrielccac/captcha-solver/contents/experiments/gha-webkit/{name}?ref=90c050e7cc48fe930f99da354e9186b5ffedf02a'
                  request=urllib.request.Request(url,headers={'Accept':'application/vnd.github.raw+json','Authorization':'Bearer '+os.environ['GHCR_TOKEN'],'X-GitHub-Api-Version':'2022-11-28'})
                  with urllib.request.urlopen(request,timeout=30) as response:
                      source=response.read()
                  assert hashlib.sha256(source).hexdigest()==expected
                  (root/name).write_bytes(source)
              sys.path.insert(0,str(root))
              runpy.run_path(str(root/'compare_run.py'),run_name='__main__')
          PY
      - name: Save only recipient-encrypted query and numeric receipt
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: inss-encrypted-result
          path: comparison-results/
          retention-days: 1
          if-no-files-found: error
