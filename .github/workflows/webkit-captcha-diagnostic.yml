name: WebKit captcha selection diagnostic
on:
  push:
    branches: [test/gha-webkit-20261104]
    paths: [.github/workflows/webkit-captcha-diagnostic.yml]
permissions:
  contents: read
  packages: read
concurrency:
  group: authorized-webkit-smoke
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: webkit-smoke-20261104
    steps:
      - name: Observe one login using the approved browser image
        env:
          GHCR_TOKEN: ${{ github.token }}
          GOVBR_CPF: ${{ secrets.SMOKE_GOVBR_CPF }}
          GOVBR_PASSWORD: ${{ secrets.SMOKE_GOVBR_PASSWORD }}
          OPENROUTER_API_KEY: ${{ secrets.SMOKE_OPENROUTER_API_KEY }}
        run: |
          python3 - <<'PY'
          import hashlib,os,pathlib,runpy,sys,tempfile,urllib.request
          sources={
            'fast_run.py':('3345f51c8d54f9413a2cae5a10a7454d63db8b3e','9b0d9505a9e11abbfa987985f091bf5b5beefda4f68096483f0c3d4d0d906d9a'),
            'captcha_probe.py':('2a2c92fecabfb1f8d9ac2cd34d298da7f3834551','a4daba58bb0b142e984eeb10de56e934b795d6fc3c99028225f9f9bf97a6d183'),
            'probe_run.py':('2a2c92fecabfb1f8d9ac2cd34d298da7f3834551','75e4527d86d18bd963fa6cf2bb114facbbe072ecab5745fbf3b05281467674ab')}
          with tempfile.TemporaryDirectory(prefix='captcha-probe-source-') as directory:
              root=pathlib.Path(directory)
              for name,(ref,expected) in sources.items():
                  url=f'https://api.github.com/repos/gabrielccac/captcha-solver/contents/experiments/gha-webkit/{name}?ref={ref}'
                  request=urllib.request.Request(url,headers={'Accept':'application/vnd.github.raw+json','Authorization':'Bearer '+os.environ['GHCR_TOKEN'],'X-GitHub-Api-Version':'2022-11-28'})
                  with urllib.request.urlopen(request,timeout=30) as response:
                      source=response.read()
                  assert hashlib.sha256(source).hexdigest()==expected
                  (root/name).write_bytes(source)
              sys.path.insert(0,str(root))
              runpy.run_path(str(root/'probe_run.py'),run_name='__main__')
          PY
      - name: Save challenge-only crops and numeric observations
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: captcha-diagnostic
          path: captcha-diagnostics
          retention-days: 1
          if-no-files-found: error
