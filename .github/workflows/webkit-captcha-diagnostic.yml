name: Validate captcha selection recovery
on:
  push:
    branches: [test/gha-webkit-20261104]
    paths: [.github/workflows/webkit-captcha-diagnostic.yml]
permissions:
  contents: read
  packages: read
concurrency:
  group: authorized-webkit-smoke
  cancel-in-progress: false
jobs:
  query:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: webkit-smoke-20261104
    steps:
      - name: Login and query using the approved immutable browser image
        env:
          GHCR_TOKEN: ${{ github.token }}
          GOVBR_CPF: ${{ secrets.SMOKE_GOVBR_CPF }}
          GOVBR_PASSWORD: ${{ secrets.SMOKE_GOVBR_PASSWORD }}
          OPENROUTER_API_KEY: ${{ secrets.SMOKE_OPENROUTER_API_KEY }}
          QUERY_RECIPIENT_CERT: ${{ secrets.SMOKE_QUERY_RECIPIENT_CERT }}
        run: |
          python3 - <<'PY'
          import hashlib,os,pathlib,runpy,tempfile,urllib.request
          sources={'query_run.py': 'ec1b15e919bb22d56a5bcf00006e5b25a1a63edbf6ab2c3d37c5bce2064f0ee8', 'query_worker.py': '8458cb568d8ed2ac39cba4965fde26d08c1facd5ef71c79f35cb0a2103810cfc'}
          with tempfile.TemporaryDirectory(prefix='retry-check-') as directory:
              root=pathlib.Path(directory)
              for name,expected in sources.items():
                  url=f'https://api.github.com/repos/gabrielccac/captcha-solver/contents/experiments/gha-webkit/{name}?ref=ed1f5dc3d3f8887be63bae7c324faec5a45ce9cd'
                  request=urllib.request.Request(url,headers={'Accept':'application/vnd.github.raw+json','Authorization': 'Bearer '+os.environ['GHCR_TOKEN'],'X-GitHub-Api-Version':'2022-11-28'})
                  with urllib.request.urlopen(request,timeout=30) as response:
                      raw=response.read()
                  assert hashlib.sha256(raw).hexdigest()==expected
                  (root/name).write_bytes(raw)
              worker=root/'query_worker.py'
              worker.write_text("\nimport sys\nsys.path.insert(0, '/app/src')\nfrom captcha.interactions import DynamicInteractions\noriginal_wait_ready = DynamicInteractions.wait_ready\npending_test_failure = True\ndef fail_before_submit_once(self, page, clip):\n    global pending_test_failure\n    confirmed = original_wait_ready(self, page, clip)\n    if pending_test_failure:\n        pending_test_failure = False\n        self.metrics[-1]['failure_phase'] = 'test_injected'\n        self.metrics[-1]['confirmed'] = False\n        return False\n    return confirmed\nDynamicInteractions.wait_ready = fail_before_submit_once\n"+worker.read_text(encoding='utf-8'),encoding='utf-8')
              runpy.run_path(str(root/'query_run.py'),run_name='__main__')
          PY
      - name: Save only recipient-encrypted query and numeric receipt
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: inss-encrypted-result
          path: encrypted-query/
          retention-days: 1
          if-no-files-found: error
